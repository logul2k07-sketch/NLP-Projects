<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Detection System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2d3748; margin-bottom: 8px; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 30px; font-size: 0.95rem; }
        textarea { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; resize: vertical; min-height: 130px; transition: border-color 0.2s; }
        textarea:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 16px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #result { margin-top: 24px; display: none; }
        .result-card { background: #f7fafc; border-radius: 8px; padding: 20px; border-left: 4px solid #667eea; }
        .detected { font-size: 1.4rem; font-weight: 700; color: #2d3748; }
        .code-badge { display: inline-block; background: #667eea; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; margin-left: 8px; vertical-align: middle; }
        .confidence { color: #718096; margin-top: 6px; font-size: 0.9rem; }
        .top-langs { margin-top: 16px; }
        .top-langs h3 { font-size: 0.9rem; color: #4a5568; margin-bottom: 10px; }
        .lang-bar { margin-bottom: 8px; }
        .lang-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #4a5568; margin-bottom: 3px; }
        .bar-track { background: #e2e8f0; border-radius: 4px; height: 8px; }
        .bar-fill { height: 8px; border-radius: 4px; background: linear-gradient(135deg, #667eea, #764ba2); transition: width 0.5s ease; }
        .error { background: #fff5f5; border-left-color: #fc8181; color: #c53030; padding: 14px; border-radius: 8px; border-left: 4px solid #fc8181; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Language Detection</h1>
        <p class="subtitle">Detect the language of any text using NLP</p>
        <textarea id="inputText" placeholder="Type or paste text here in any language..."></textarea>
        <button id="detectBtn" onclick="detectLanguage()">Detect Language</button>
        <div id="result"></div>
    </div>

    <script>
        async function detectLanguage() {
            const text = document.getElementById("inputText").value.trim();
            const btn = document.getElementById("detectBtn");
            const resultDiv = document.getElementById("result");

            if (!text) { alert("Please enter some text."); return; }

            btn.disabled = true;
            btn.textContent = "Detecting...";
            resultDiv.style.display = "none";

            try {
                const res = await fetch("/detect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                resultDiv.style.display = "block";

                if (data.error) {
                    resultDiv.innerHTML = `<div class="error">⚠️ ${data.error}</div>`;
                } else {
                    const barsHtml = data.top_languages.map(l => `
                        <div class="lang-bar">
                            <div class="lang-label"><span>${l.language}</span><span>${l.confidence}%</span></div>
                            <div class="bar-track"><div class="bar-fill" style="width: ${l.confidence}%"></div></div>
                        </div>`).join("");

                    resultDiv.innerHTML = `
                        <div class="result-card">
                            <div class="detected">${data.detected_language} <span class="code-badge">${data.language_code.toUpperCase()}</span></div>
                            <div class="confidence">Confidence: ${data.confidence}%</div>
                            <div class="top-langs">
                                <h3>Top Detected Languages</h3>
                                ${barsHtml}
                            </div>
                        </div>`;
                }
            } catch {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<div class="error">⚠️ Server error. Please try again.</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Detect Language";
            }
        }

        document.getElementById("inputText").addEventListener("keydown", e => {
            if (e.ctrlKey && e.key === "Enter") detectLanguage();
        });
    </script>
</body>
</html>
