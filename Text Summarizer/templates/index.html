<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 Text Summarizer</h1>
        <p class="subtitle">Summarize long text using NLP</p>

        <div class="form-group">
            <label>Input Text</label>
            <textarea id="inputText" placeholder="Paste your text here..." rows="10"></textarea>
        </div>

        <div class="form-group inline">
            <label>Number of sentences in summary:</label>
            <input type="number" id="numSentences" value="3" min="1" max="20">
        </div>

        <button id="summarizeBtn" onclick="summarize()">Summarize</button>

        <div id="result" class="result hidden">
            <h2>Summary</h2>
            <p id="summaryText"></p>
        </div>

        <div id="error" class="error hidden"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
